name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which parts of the monorepo changed so each suite only runs when
  # relevant — without losing a single, always-reported merge gate.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: beacon_test
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U beacon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://beacon:beacon@localhost:5433/beacon_test
      DATABASE_URL_SYNC: postgresql+psycopg://beacon:beacon@localhost:5433/beacon_test
      TEST_DATABASE_URL: postgresql+asyncpg://beacon:beacon@localhost:5433/beacon_test
      REDIS_URL: redis://localhost:6379/0
      CLERK_SECRET_KEY: sk_test_ci
      CLERK_WEBHOOK_SECRET: ""
      FRONTEND_URL: http://localhost:3000
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy app/

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest --cov=app --cov-report=term-missing -v

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

  # Single required status check for branch protection. Passes when every
  # suite either succeeded or was legitimately skipped (path not touched);
  # fails if any suite failed or was cancelled. This is the check to mark
  # "Required" in branch protection — never the individual suites, which
  # would block merges whenever path filters skip one.
  ci-passed:
    needs: [backend, frontend]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required suites
        run: |
          backend="${{ needs.backend.result }}"
          frontend="${{ needs.frontend.result }}"
          echo "backend=$backend frontend=$frontend"
          for result in "$backend" "$frontend"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::A required CI suite did not pass."
              exit 1
            fi
          done
          echo "All required CI suites passed or were skipped."
